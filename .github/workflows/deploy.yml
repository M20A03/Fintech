name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Web Quality & Assets Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Core Web Assets
        run: |
          test -f index.html || (echo "❌ Missing index.html" && exit 1)
          test -f styles.css || (echo "❌ Missing styles.css" && exit 1)
          test -f vercel.json || (echo "❌ Missing vercel.json" && exit 1)
          echo "✅ All production static assets verified successfully."
