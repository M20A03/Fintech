<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Isometric cube — clean, geometric, minimalist -->
  <!-- Top face — vibrant orange -->
  <polygon points="50,10 90,33 50,56 10,33" fill="#E8651A"/>
  <!-- Left face — near black -->
  <polygon points="10,33 50,56 50,93 10,70" fill="#1A1A1A"/>
  <!-- Right face — dark charcoal -->
  <polygon points="90,33 50,56 50,93 90,70" fill="#2D2D2D"/>

  <!-- Grid lines on top face — risk matrix / structure motif -->
  <line x1="30" y1="21.5" x2="70" y2="44.5" stroke="#D45B15" stroke-width="0.7" opacity="0.45"/>
  <line x1="50" y1="33" x2="10" y2="44.5" stroke="#D45B15" stroke-width="0.7" opacity="0.35"/>
  <line x1="50" y1="33" x2="90" y2="44.5" stroke="#D45B15" stroke-width="0.7" opacity="0.35"/>

  <!-- Centre vertical edge highlight -->
  <line x1="50" y1="56" x2="50" y2="93" stroke="#3D3D3D" stroke-width="0.6" opacity="0.5"/>
</svg>
